[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "property-scanner"
version = "0.1.0"
description = "Lightweight foundation for a shared property scanning pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
rendering = ["numpy>=1.26,<3", "shapely>=2,<3", "matplotlib>=3.8,<4"]
geometry = ["open3d>=0.18,<0.20", "numpy>=1.26,<3", "shapely>=2,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "jsonschema>=4.20,<5"]

[project.scripts]
property-scan = "property_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["property_scanner*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
