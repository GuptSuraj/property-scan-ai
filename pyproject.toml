[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "property-scanner"
version = "0.1.0"
description = "Lightweight foundation for a shared property scanning pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
photo = ["open3d>=0.18,<0.20", "numpy>=1.26,<3", "scipy>=1.11,<2", "shapely>=2,<3", "matplotlib>=3.8,<4", "pillow>=10,<13", "pillow-heif>=0.18,<2", "opencv-python>=4.9,<6", "torch>=2.4,<3", "transformers>=4.46,<5", "huggingface-hub>=0.26,<1"]
video = ["open3d>=0.18,<0.20", "numpy>=1.26,<3", "scipy>=1.11,<2", "shapely>=2,<3", "matplotlib>=3.8,<4", "pillow>=10,<13", "opencv-python>=4.9,<6", "torch>=2.4,<3", "transformers>=4.46,<5", "huggingface-hub>=0.26,<1"]
lidar = ["open3d>=0.18,<0.20", "numpy>=1.26,<3", "scipy>=1.11,<2", "shapely>=2,<3", "matplotlib>=3.8,<4", "pillow>=10,<13", "opencv-python>=4.9,<6", "torch>=2.4,<3", "transformers>=4.46,<5", "huggingface-hub>=0.26,<1", "pyliblzfse>=0.4.1,<1"]
openings = ["numpy>=1.26,<3", "scipy>=1.11,<2", "shapely>=2,<3", "matplotlib>=3.8,<4", "pillow>=10,<13", "opencv-python>=4.9,<6", "torch>=2.4,<3", "transformers>=4.46,<5", "huggingface-hub>=0.26,<1"]
damage = ["numpy>=1.26,<3", "shapely>=2,<3", "pillow>=10,<13", "torch>=2.4,<3", "ultralytics>=8.3.159,<9"]
ui = ["streamlit>=1.39,<2", "pandas>=2.2,<3"]
rendering = ["numpy>=1.26,<3", "shapely>=2,<3", "matplotlib>=3.8,<4"]
geometry = ["open3d>=0.18,<0.20", "numpy>=1.26,<3", "shapely>=2,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "jsonschema>=4.20,<5"]

[project.scripts]
property-scan = "property_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["property_scanner*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
